<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trimly | Email Verified</title>
    <link rel="icon" type="image/png" href="/static/trimly-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css?v=20260922emailverify1" />
  </head>
  <body data-page="verify-email">
    <main class="section verification-complete-page">
      <div class="container form-shell">
        <section class="form-card verification-complete-card" aria-live="polite">
          <span class="brand-badge"><img class="brand-badge-image" src="/static/trimly-logo.png" alt="Trimly" /></span>
          <h1 class="section-title" id="verificationCompleteTitle">Verifying your email...</h1>
          <p class="section-subtitle" id="verificationCompleteCopy">Please wait while we activate your Trimly account.</p>
          <div class="loading" aria-label="Loading"></div>
          <button class="btn btn-primary hidden" id="verificationCompleteRetry" type="button">Continue to Trimly</button>
          <p class="muted"><a href="/static/login.html">Go to login instead</a></p>
        </section>
      </div>
    </main>
    <script type="module" src="/static/main.js?v=20260922emailverify1"></script>
  </body>
</html>
