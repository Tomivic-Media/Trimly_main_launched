<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="trustpilot-one-time-domain-verification-id" content="dbfbe3e2-a523-4e23-bee5-60327bc8a48a" />
    <title>Create Account</title>
    <link rel="icon" type="image/png" href="/static/trimly-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="/static/CSS/create_customer.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="login-container">
      <div class="form-side">
        <h2 id="login-text">Create Your Account</h2>
        <p id="text-1">Create an account to get started</p>
        <p id="text-2">Enter your credentials</p>

        <form action="" id="main-form">
          <input type="hidden" name="role" id="role-input" />

          <div class="form-control customer-id">
            <label for="customer_id">Email</label>
            <div class="input-container">
              <input type="email" placeholder="Your Email" required name="customer_id" />
            </div>
          </div>

          <div class="form-control password-input">
            <label for="password">Create Password</label>
            <div class="input-container">
              <input type="password" placeholder="Create a password" name="password" required />
            </div>
          </div>

          <button id="login-btn" type="submit">Create account</button>
        </form>

        <p id="reset-pass-link">
          Already have an account?
          <a href="/static/login_customer.html">Login</a>
        </p>
      </div>
    </div>

    <script src="/frontend/api-client.js"></script>
    <script src="/frontend/auth-pages.js"></script>
  </body>
</html>
