<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="trustpilot-one-time-domain-verification-id" content="dbfbe3e2-a523-4e23-bee5-60327bc8a48a" />
    <title>Trimly | Campaign Application</title>
    <link rel="icon" type="image/png" href="/static/trimly-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css?v=20260717sidebar1" />
  </head>
  <body data-page="campaign-apply">
    <header class="site-header">
      <div class="container nav-shell">
        <a class="brand" href="/">
          <span class="brand-badge"><img class="brand-badge-image" src="/static/trimly-logo.png" alt="" /></span>
          <span>Trimly</span>
        </a>
        <button class="nav-toggle" data-nav-toggle aria-label="Toggle menu">Menu</button>
        <nav class="nav-main" data-nav-menu>
          <div class="nav-links">
            <a href="/">Home</a>
            <a href="/static/barbers.html">Barbers</a>
            <a class="active" href="/free-haircut-campaign">Campaign</a>
            <a href="/static/dashboard.html">Dashboard</a>
          </div>
          <div class="auth-actions" data-auth-actions>
            <a class="btn btn-ghost" href="/static/login.html">Login</a>
            <a class="btn btn-primary" href="/static/register.html">Register</a>
            <a class="auth-admin-link" href="/static/admin-login.html">Admin Login</a>
          </div>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container dashboard-container">
        <section class="booking-page-grid">
          <article class="panel booking-primary-panel">
            <div class="panel-head-row">
              <div>
                <h1>Campaign application</h1>
                <p class="muted booking-panel-subtitle">Apply once with your Trimly account email. Duplicate applications are blocked automatically.</p>
              </div>
            </div>
            <p id="campaignApplyStatus" class="notice"></p>
            <div id="campaignApplyNotice" class="customer-feature-panel"></div>
            <form id="campaignApplyForm" class="form-grid">
              <div class="form-grid form-grid-2">
                <div>
                  <label for="campaign_first_name">First name</label>
                  <input id="campaign_first_name" name="first_name" class="input" type="text" required />
                </div>
                <div>
                  <label for="campaign_surname">Surname</label>
                  <input id="campaign_surname" name="surname" class="input" type="text" required />
                </div>
              </div>
              <div>
                <label for="campaign_address">Address</label>
                <input id="campaign_address" name="address" class="input" type="text" placeholder="Street, area, city" required />
              </div>
              <div class="form-grid form-grid-2">
                <div>
                  <label for="campaign_email">Email</label>
                  <input id="campaign_email" name="email" class="input" type="email" required />
                </div>
                <div>
                  <label for="campaign_phone">Phone number</label>
                  <input id="campaign_phone" name="phone" class="input" type="tel" required />
                </div>
              </div>
              <div>
                <label for="campaign_social_handles">Social media handles</label>
                <input id="campaign_social_handles" name="social_handles" class="input" type="text" placeholder="@instagram, @tiktok, @x" />
              </div>
              <div>
                <label for="campaign_how_heard">How did you hear about us?</label>
                <textarea id="campaign_how_heard" name="how_heard_about_us" class="input" rows="4" placeholder="Friend, Instagram, WhatsApp, barber referral..." required></textarea>
              </div>
              <button class="btn btn-primary" type="submit">Submit application</button>
            </form>
          </article>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-row">
        <span>&copy; <span data-current-year></span> Trimly</span>
        <div class="footer-links-inline">
          <a href="/static/acceptable-use.html">Acceptable Use</a>
          <a href="/static/refund-cancellation-policy.html">Refund & Cancellation</a>
        </div>
      </div>
    </footer>

    <div id="toast" class="toast"></div>
    <script type="module" src="/static/main.js?v=20260811campaignlive1"></script>
  </body>
</html>
